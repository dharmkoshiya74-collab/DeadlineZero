services:
  - type: web
    name: deadlinezero
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_FLAGSMITH_ENVIRONMENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
